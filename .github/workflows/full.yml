name: Build Kernel for Xiaomi fuxi (SM8550)

on:
  workflow_dispatch:
  # push:
  #   branches: [ main, lineage-23.2 ]

env:
  KERNEL_DIR: kernel/xiaomi/sm8550
  DEVICE_COMMON_DIR: device/xiaomi/sm8550-common
  DEVICE_FUXI_DIR: device/xiaomi/fuxi
  MODULES_DIR: vendor/xiaomi/sm8550-modules
  OUT_DIR: out/kernel
  RELEASE_DIR: releases
  ARCH: arm64
  KERNELSU_VERSION: main
  # NDK 版本
  NDK_VERSION: r26c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装系统依赖（不安装 docker.io）
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache \
            flex libssl-dev libelf-dev \
            git git-lfs wget curl cpio \
            python3 python3-pip \
            lz4 lzop xz-utils device-tree-compiler
          pip3 install PyYAML

      # 2. 设置 ccache 加速
      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          mkdir -p .ccache
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

      # 3. 检出内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Geeeeeker/android_kernel_xiaomi_sm8550
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      # 4. 检出设备树仓库
      - name: Checkout device trees
        run: |
          git clone --depth 1 -b lineage-23.2 https://github.com/LineageOS/android_device_xiaomi_sm8550-common ${{ env.DEVICE_COMMON_DIR }}
          git clone --depth 1 -b lineage-23.2 https://github.com/LineageOS/android_device_xiaomi_fuxi ${{ env.DEVICE_FUXI_DIR }}

      # 5. 检出内核模块仓库
      - name: Checkout kernel modules
        run: |
          git clone --depth 1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8550-modules ${{ env.MODULES_DIR }}

      # 6. 下载并设置 Android NDK 工具链
      - name: Setup NDK toolchain
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip -d /tmp/
          echo "PATH=/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      # 7. 集成 KernelSU
      - name: Integrate KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KERNELSU_VERSION }}
          # 可选：添加 susfs 扩展
          # curl -LSs "https://raw.githubusercontent.com/simonpunk/susfs4ksu/main/setup.sh" | bash -s v1.5.5

      # 8. 修改 defconfig（启用 KernelSU 和 USBIP）
      - name: Configure defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 备份原配置
          cp arch/arm64/configs/fuxi_GKI_defconfig arch/arm64/configs/fuxi_GKI_defconfig.bak
          # 追加配置
          cat >> arch/arm64/configs/fuxi_GKI_defconfig <<EOF
          CONFIG_KSU=y
          CONFIG_USBIP_CORE=m
          CONFIG_USBIP_VHCI_HCD=m
          CONFIG_USBIP_HOST=m
          # CONFIG_USBIP_DEBUG=y
          EOF

      # 9. 编译主内核和模块（不包含 USBIP）
      - name: Build kernel and modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH=$PATH
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export AS=llvm-as
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export CROSS_COMPILE=aarch64-linux-android-
          export ARCH=${{ env.ARCH }}
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export CCACHE_MAXSIZE=2G
          export CC="ccache clang"

          make ${{ env.ARCH }} fuxi_GKI_defconfig
          # 可选：合并设备树中的额外配置
          # cat ../../${{ env.DEVICE_FUXI_DIR }}/extra_defconfig >> .config

          # 编译内核镜像
          make -j$(nproc) Image.gz dtbo.img

          # 编译所有模块（排除 USBIP，后面单独处理）
          make -j$(nproc) modules

          # 创建输出目录
          mkdir -p ../../${{ env.OUT_DIR }}/modules

          # 复制内核镜像
          cp arch/arm64/boot/Image.gz ../../${{ env.OUT_DIR }}/
          cp arch/arm64/boot/dtbo.img ../../${{ env.OUT_DIR }}/

          # 复制普通模块（排除 USBIP）
          find . -name "*.ko" -not -path "./drivers/usb/usbip/*" -exec cp {} ../../${{ env.OUT_DIR }}/modules/ \;

      # 10. 使用 Docker 编译 USBIP 模块（参考 full 方式）
      - name: Build USBIP modules with Docker
        run: |
          # 准备 Dockerfile，包含交叉编译工具链
          cat > Dockerfile <<'EOF'
          FROM ubuntu:22.04
          RUN apt update && apt install -y \
              build-essential bc bison flex libssl-dev libelf-dev \
              git cpio kmod wget xz-utils \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          WORKDIR /build
          EOF

          # 构建镜像
          docker build -t usbip-builder .

          # 准备编译脚本（在容器内执行）
          cat > build_usbip.sh <<'EOF'
          #!/bin/bash
          set -e
          KERNEL_SRC="$1"
          OUTPUT_DIR="$2"

          cd "$KERNEL_SRC"
          # 清理残留
          make mrproper
          # 使用修改后的 defconfig（已包含 USBIP 模块配置）
          cp arch/arm64/configs/fuxi_GKI_defconfig .config
          # 确保 USBIP 相关配置正确（以防 defconfig 未完全包含）
          scripts/config --enable CONFIG_USBIP_CORE
          scripts/config --enable CONFIG_USBIP_VHCI_HCD
          scripts/config --enable CONFIG_USBIP_HOST
          scripts/config --module CONFIG_USBIP_CORE
          scripts/config --module CONFIG_USBIP_VHCI_HCD
          scripts/config --module CONFIG_USBIP_HOST

          # 设置交叉编译环境
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 准备模块编译环境
          make modules_prepare
          # 仅编译 USBIP 模块
          make M=drivers/usb/usbip modules

          # 复制产物
          mkdir -p "$OUTPUT_DIR"
          cp drivers/usb/usbip/*.ko "$OUTPUT_DIR"
          EOF
          chmod +x build_usbip.sh

          # 运行容器，挂载内核源码和输出目录
          docker run --rm \
            -v ${{ github.workspace }}/${{ env.KERNEL_DIR }}:/build/kernel \
            -v ${{ github.workspace }}/${{ env.OUT_DIR }}/usbip:/out \
            -v ${{ github.workspace }}/build_usbip.sh:/build_usbip.sh \
            usbip-builder /bin/bash /build_usbip.sh /build/kernel /out

      # 11. 合并 USBIP 模块到主模块目录
      - name: Merge USBIP modules
        run: |
          cp ${{ env.OUT_DIR }}/usbip/*.ko ${{ env.OUT_DIR }}/modules/ || true

      # 12. 打包最终产物
      - name: Package artifacts
        run: |
          mkdir -p ${{ env.RELEASE_DIR }}
          tar -czf ${{ env.RELEASE_DIR }}/kernel-fuxi-$(date +%Y%m%d-%H%M%S).tar.gz -C ${{ env.OUT_DIR }} .
          echo "Build date: $(date)" > ${{ env.RELEASE_DIR }}/build_info.txt
          echo "KernelSU version: ${{ env.KERNELSU_VERSION }}" >> ${{ env.RELEASE_DIR }}/build_info.txt
          echo "Kernel commit: $(cd ${{ env.KERNEL_DIR }} && git rev-parse --short HEAD)" >> ${{ env.RELEASE_DIR }}/build_info.txt

      # 13. 上传工件
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fuxi
          path: ${{ env.RELEASE_DIR }}/
          retention-days: 7
